name: Import ProjectSim 2 and preserve Navi UI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/import-projectsim-2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_ARTIFACT_URL: 'https://productionresultssa2.blob.core.windows.net/actions-results/54bc6104-b021-4e6c-97a4-9da5ec13bae0/workflow-job-run-4151ab6b-c948-574e-9dca-dec6fda93d5f/artifacts/78621092b41f8c330e7d27fd9913fe92379cf26b0794b0ec18f7df32e0517748.zip?rscd=attachment%3B+filename%3D%22projectsim-2-tar-transfer-30513667362.zip%22&rsct=application%2Fzip&se=2026-07-30T04%3A35%3A04Z&sig=C7mgwzmWYYuKH1KK2gjXCkzMV5wO%2BFYw67KXsEDEAQI%3D&ske=2026-07-30T07%3A04%3A48Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-07-30T03%3A04%3A48Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-07-30T04%3A24%3A59Z&sv=2025-11-05'
      PROJECTSIM_SOURCE_SHA: '391ff03f491b199e540a3a02f4eb935c6c1e27d6'
      NAVI_SOURCE_SHA: '0eb6abfdafde14a6fedd06f3a8b0f75dc9f58870'

    steps:
      - name: Check out Navi Plan migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Preserve Navi Plan UI reference files and importer
        shell: bash
        run: |
          set -euo pipefail
          preserve_root="${RUNNER_TEMP}/navi-ui"
          mkdir -p "${preserve_root}"
          cp .github/workflows/import-projectsim-2.yml "${RUNNER_TEMP}/import-projectsim-2.yml"

          copy_path() {
            local path="$1"
            if [[ -e "${path}" ]]; then
              mkdir -p "${preserve_root}/$(dirname "${path}")"
              cp -a "${path}" "${preserve_root}/${path}"
            fi
          }

          copy_path "src/components"
          copy_path "src/assets"
          copy_path "public"
          copy_path "src/styles.css"
          copy_path "src/hooks/use-mobile.tsx"
          copy_path "src/lib/utils.ts"
          copy_path "components.json"
          copy_path "tailwind.config.ts"
          copy_path "tailwind.config.js"
          copy_path "postcss.config.js"
          copy_path "postcss.config.cjs"
          copy_path "index.html"

          if [[ -d src ]]; then
            while IFS= read -r -d '' style_file; do
              copy_path "${style_file}"
            done < <(find src -type f \( -name '*.css' -o -name '*.scss' -o -name '*.sass' \) -print0)
          fi

          find "${preserve_root}" -type f | sort > "${RUNNER_TEMP}/preserved-ui-files.txt"
          echo "Preserved $(wc -l < "${RUNNER_TEMP}/preserved-ui-files.txt") UI reference files"

      - name: Download ProjectSim 2 transfer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            "${SOURCE_ARTIFACT_URL}" \
            --output "${RUNNER_TEMP}/projectsim-transfer.zip"
          mkdir -p "${RUNNER_TEMP}/projectsim-artifact"
          unzip -q "${RUNNER_TEMP}/projectsim-transfer.zip" -d "${RUNNER_TEMP}/projectsim-artifact"
          archive_path="$(find "${RUNNER_TEMP}/projectsim-artifact" -type f -name 'projectsim-2-main.tar.gz' -print -quit)"
          if [[ -z "${archive_path}" ]]; then
            echo "ProjectSim 2 tar archive was not found in the artifact" >&2
            exit 1
          fi
          echo "PROJECTSIM_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"

      - name: Replace repository tree with ProjectSim 2
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -xzf "${PROJECTSIM_ARCHIVE}" -C .

          test -f package.json
          test -d apps/web
          test -d packages
          test -d docs

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "${RUNNER_TEMP}/import-projectsim-2.yml" .github/workflows/import-projectsim-2.yml

      - name: Restore Navi Plan UI as isolated visual reference
        shell: bash
        run: |
          set -euo pipefail
          legacy_root="legacy-ui/navi-plan-game"
          mkdir -p "${legacy_root}"
          cp -a "${RUNNER_TEMP}/navi-ui/." "${legacy_root}/"

          cat > "${legacy_root}/README.md" <<'EOF'
          # Navi Plan legacy UI reference

          These files were preserved from `BilalAli1-code/navi-plan-game` at commit
          `0eb6abfdafde14a6fedd06f3a8b0f75dc9f58870` during the ProjectSim 2 repository migration.

          They are retained as a **visual and interaction reference only**:

          - reusable colors, typography, spacing, cards, badges, layouts, responsive patterns, icons, and assets may be adapted;
          - legacy simulation state, `useSim()` behavior, client-side progress or decision calculations, routes, Supabase/Lovable integrations, and backend logic must not become authoritative;
          - active product behavior remains in the ProjectSim 2 Domain, Application, Infrastructure, API, projection, and `apps/web` boundaries.

          Use the migration matrix in
          `docs/business-cases/12-legacy-visual-transfer/` when adapting these visuals into active ProjectSim 2 surfaces.
          EOF

          cat > MIGRATION_SOURCE.md <<EOF
          # Repository migration source

          - ProjectSim 2 source: \`BilalAli1-code/projectsim-2\`
          - Source branch: \`main\`
          - Source commit: \`${PROJECTSIM_SOURCE_SHA}\`
          - Destination repository: \`BilalAli1-code/navi-plan-game\`
          - Preserved Navi Plan baseline: \`${NAVI_SOURCE_SHA}\`
          - Backup branch: \`backup/navi-plan-game-before-projectsim2-20260730\`
          - Legacy UI reference: \`legacy-ui/navi-plan-game/\`

          The repository root is the authoritative ProjectSim 2 codebase. Legacy Navi Plan UI files are isolated for visual transfer only.
          EOF

      - name: Commit imported repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import ProjectSim 2 and preserve Navi UI reference"
          git push origin "HEAD:${TARGET_BRANCH}"
