name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://projectsim_app:projectsim_app@127.0.0.1:5432/projectsim_test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/projectsim_test
      SUPABASE_JWT_SECRET: ps008-e2e-jwt-secret
      PROJECTSIM_E2E_SEAM_SECRET: ps008-e2e-seam-secret
      E2E_ALLOW_GLOBAL_RESET: "1"
      E2E_API_BASE_URL: http://127.0.0.1:8787
      E2E_WEB_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create app role and grant privileges
        run: |
          psql "$DATABASE_ADMIN_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'projectsim_app') THEN
              CREATE ROLE projectsim_app LOGIN PASSWORD 'projectsim_app';
            END IF;
          END
          $$;
          GRANT ALL ON SCHEMA public TO projectsim_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO projectsim_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO projectsim_app;
          SQL

      - name: Apply migrations
        run: pnpm run db:migrate

      - name: Grant table privileges after migrations
        run: |
          psql "$DATABASE_ADMIN_URL" <<'SQL'
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO projectsim_app;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO projectsim_app;
          SQL

      - name: Build workspace packages
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm --filter @projectsim/web exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
          if-no-files-found: ignore
