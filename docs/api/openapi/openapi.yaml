        authoritative scheduleSequence. Start/complete/cancel/reschedule remain
        unsupported. GET is side-effect free and does not mutate Meeting lifecycle.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Meetings projection
          headers:
