openapi: 3.1.0
info:
  title: ProjectSim 2.0 Simulation API
  version: 1.0.0
  description: |
    Public routes for canonical SimulationProjection reads, Mission Control
    projection reads (PS-ROADMAP-011), and SubmitDecision commands. Routes
    delegate to Application services; they do not expose database rows, outbox,
    or hidden content.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /simulation-runs/{simulationRunId}/projection:
    get:
      operationId: getSimulationProjection
      summary: Get canonical SimulationProjection
      description: |
        Authenticated read of the learner-safe SimulationProjection via
        GetSimulationProjection. Includes freshness and sourceAggregateVersion
        for command synchronization. Stale/rebuild_failed projections must not
        be used for SubmitDecision.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Canonical projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionApiResponse"
              examples:
                current:
                  value:
                    data:
                      projectionType: simulation
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 2
                      sourceStateVersion: 0
                      sourceActionSequence: 0
                      generatedAt: "2026-07-25T12:00:00.000Z"
                      run:
                        simulationRunId: run_1
                        status: active
                        startedAt: "2026-07-25T11:00:00.000Z"
                        pausedAt: null
                        completedAt: null
                        archivedAt: null
                        currentChapterId: null
                        currentDayId: null
                        contentPackageVersionId: cpv_1
                        sourceStateVersion: 0
                      project:
                        status: initiated
                        sourceStateVersion: 0
                        metrics:
                          - metricKey: budget
                            value: 100
                            unit: USD
                      availableDecisions:
                        - decisionDefinitionId: decision_1
                          title: Scaffold Decision
                          prompt: Choose how to proceed.
                          description: Deterministic fixture decision
                          status: available
                          expiresAt: null
                          authoredOrder: 0
                          options:
                            - optionId: option_a
                              label: Conservative option
                              authoredOrder: 0
                            - optionId: option_b
                              label: Balanced option
                              authoredOrder: 1
                      decisionHistory: []
                    meta:
                      requestId: req_1
                      correlationId: corr_1
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 2
                      freshness: current
                      generatedAt: "2026-07-25T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /simulation-runs/{simulationRunId}/mission-control:
    get:
      operationId: getMissionControlProjection
      summary: Get learner-facing Mission Control projection
      description: |
        Authenticated read of the learner-safe Mission Control projection via
        GetMissionControlProjection. Binds projection type `mission_control`
        internally. Clients cannot select projection type, tenant, schema
        version, or force rebuild. Read-only; Decision mutation remains on
        SubmitDecision.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Mission Control projection
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionControlApiResponse"
              examples:
                current:
                  value:
                    data:
                      projectionType: mission_control
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 2
                      sourceStateVersion: 0
                      sourceActionSequence: 0
                      generatedAt: "2026-07-25T12:00:00.000Z"
                      runSummary:
                        simulationRunId: run_1
                        status: active
                        startedAt: "2026-07-25T11:00:00.000Z"
                        completedAt: null
                        currentChapterId: null
                        currentDayId: null
                        contentPackageVersionId: cpv_1
                      projectSummary:
                        status: initiated
                        metrics:
                          - metricKey: budget
                            value: 100
                            unit: USD
                      counts:
                        pendingDecisions:
                          availability: available
                          count: 1
                        unreadActionRequiredInboxItems:
                          availability: unavailable
                          reason: channel_not_implemented
                        upcomingMeetings:
                          availability: unavailable
                          reason: channel_not_implemented
                      nextRecommendedActions:
                        - actionId: decision:decision_1
                          label: Scaffold Decision
                          targetKind: decision
                          targetId: decision_1
                          authoredOrder: 0
                      recentRevealedOutcome: null
                    meta:
                      requestId: req_1
                      correlationId: corr_1
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 2
                      freshness: current
                      generatedAt: "2026-07-25T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /simulation-runs/{simulationRunId}/decision-log:
    get:
      operationId: getDecisionLogProjection
      summary: Get learner-facing Decision Log projection
      description: |
        Authenticated read of the learner-safe Decision Log projection via
        GetDecisionLogProjection. Binds projection type `decision_log`
        internally. Clients cannot select projection type, tenant, schema
        version, or force rebuild. Empty `entries` means no completed
        learner-visible decisions yet (available empty), not unavailable.
        Read-only; Decision mutation remains on SubmitDecision.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Decision Log projection
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLogApiResponse"
              examples:
                empty:
                  value:
                    data:
                      projectionType: decision_log
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 2
                      sourceStateVersion: 0
                      sourceActionSequence: 0
                      generatedAt: "2026-07-25T12:00:00.000Z"
                      entries: []
                      summary:
                        totalEntries: 0
                        isEmpty: true
                    meta:
                      requestId: req_1
                      correlationId: corr_1
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 2
                      freshness: current
                      generatedAt: "2026-07-25T12:00:00.000Z"
                populated:
                  value:
                    data:
                      projectionType: decision_log
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 4
                      sourceStateVersion: 2
                      sourceActionSequence: 1
                      generatedAt: "2026-07-25T12:05:00.000Z"
                      entries:
                        - entryId: drec_1
                          decisionRecordId: drec_1
                          decisionDefinitionId: decision_1
                          sequence: 1
                          decidedAt: "2026-07-25T12:04:00.000Z"
                          title: Stakeholder alignment
                          selectedOption:
                            optionId: option_a
                            label: Align now
                          status: resolved
                          revealedOutcome:
                            summary: Stakeholders accepted the revised plan.
                      summary:
                        totalEntries: 1
                        isEmpty: false
                    meta:
                      requestId: req_2
                      correlationId: corr_2
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 4
                      freshness: current
                      generatedAt: "2026-07-25T12:05:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /simulation-runs/{simulationRunId}/inbox:
    get:
      operationId: getInboxProjection
      summary: Get learner-facing Inbox projection
      description: |
        Authenticated read of the learner-safe Inbox projection via
        GetInboxProjection. Binds projection type `inbox` internally. Clients
        cannot select projection type, tenant, schema version, or force rebuild.
        Empty `messages` means no delivered learner-visible messages yet
        (available empty), not unavailable. Messages are newest-first by
        authoritative deliverySequence. Read/archive/reply/compose remain
        unsupported. GET is side-effect free and does not mark messages read.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Inbox projection
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxApiResponse"
              examples:
                empty:
                  value:
                    data:
                      projectionType: inbox
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 2
                      sourceStateVersion: 0
                      sourceActionSequence: 0
                      generatedAt: "2026-07-26T12:00:00.000Z"
                      messages: []
                      summary:
                        totalMessages: 0
                        isEmpty: true
                      capabilities:
                        readState: unsupported
                        archive: unsupported
                        reply: unsupported
                        compose: unsupported
                    meta:
                      requestId: req_1
                      correlationId: corr_1
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 2
                      freshness: current
                      generatedAt: "2026-07-26T12:00:00.000Z"
                populated:
                  value:
                    data:
                      projectionType: inbox
                      projectionSchemaVersion: 1
                      simulationRunId: run_1
                      learnerId: learner_1
                      contentPackageVersionId: cpv_1
                      sourceAggregateVersion: 4
                      sourceStateVersion: 2
                      sourceActionSequence: 1
                      generatedAt: "2026-07-26T12:05:00.000Z"
                      messages:
                        - messageId: learner_message:consequence_1
                          definitionId: msg_def_1
                          definitionVersion: "1"
                          sequence: 1
                          deliveredAt: "2026-07-26T12:04:00.000Z"
                          sender:
                            senderId: stakeholder_sponsor
                            displayName: Alex Sponsor
                            roleLabel: Executive Sponsor
                          subject: Project update
                          preview: The sponsor shared an update on the timeline.
                          body: The sponsor shared an update on the timeline.
                      summary:
                        totalMessages: 1
                        isEmpty: false
                      capabilities:
                        readState: unsupported
                        archive: unsupported
                        reply: unsupported
                        compose: unsupported
                    meta:
                      requestId: req_2
                      correlationId: corr_2
                      apiVersion: v1
                      projectionSchemaVersion: 1
                      sourceAggregateVersion: 4
                      freshness: current
                      generatedAt: "2026-07-26T12:05:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
