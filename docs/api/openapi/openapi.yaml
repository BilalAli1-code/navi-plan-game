        learnerId: { type: string }
        contentPackageVersionId: { type: string }
        sourceAggregateVersion: { type: integer }
        sourceStateVersion: { type: integer }
        sourceActionSequence: { type: integer }
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - activityId
              - creationSequence
              - completionSequence
              - title
              - summary
              - source
              - status
              - createdAt
              - completedAt
            properties:
              activityId: { type: string }
              creationSequence: { type: integer, minimum: 1 }
              completionSequence: { type: integer, minimum: 1 }
              title: { type: string }
              summary: { type: string }
              body: { type: string, nullable: true }
              source:
                type: object
                additionalProperties: false
                required: [kind, sourceId, reason]
                properties:
                  kind:
                    type: string
                    enum:
                      - simulation
                      - meeting
                      - stakeholder
                      - document
                      - decision
                      - inbox
                      - authored_consequence
                  sourceId: { type: string, nullable: true }
                  reason: { type: string, nullable: true }
              status: { type: string, const: completed }
              createdAt: { type: string, format: date-time }
              completedAt: { type: string, format: date-time }
        summary:
          type: object
          additionalProperties: false
          required: [totalCompleted, isEmpty]
          properties:
            totalCompleted: { type: integer, minimum: 0 }
            isEmpty: { type: boolean }
        capabilities:
          type: object
          additionalProperties: false
          required: [reopen, clear, export]
          properties:
            reopen: { type: string, const: unsupported }
            clear: { type: string, const: unsupported }
            export: { type: string, const: unsupported }
    CompletedHistoryApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ClientCompletedHistoryProjection"
        meta:
          type: object
          required:
            - requestId
            - correlationId
            - apiVersion
            - projectionSchemaVersion
            - sourceAggregateVersion
            - freshness
            - generatedAt
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
            projectionSchemaVersion: { type: integer, const: 1 }
            sourceAggregateVersion: { type: integer }
            freshness:
              type: string
              enum: [current, stale, rebuild_failed]
            generatedAt: { type: string, format: date-time }
    MissionControlApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ClientMissionControlProjection"
        meta:
          type: object
          required:
            - requestId
            - correlationId
            - apiVersion
            - projectionSchemaVersion
            - sourceAggregateVersion
            - freshness
            - generatedAt
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
            projectionSchemaVersion: { type: integer, const: 1 }
            sourceAggregateVersion: { type: integer }
            freshness:
              type: string
              enum: [current, stale, rebuild_failed]
            generatedAt: { type: string, format: date-time }
    SubmitDecisionApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SubmitDecisionReceipt"
        meta:
          type: object
          required: [requestId, correlationId, apiVersion]
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            details:
              type: object
              additionalProperties: true
            requestId: { type: string }
            correlationId: { type: string }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Run unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Idempotency or business conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PreconditionFailed:
      description: Aggregate version conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unprocessable:
      description: Domain/business-rule rejection
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
