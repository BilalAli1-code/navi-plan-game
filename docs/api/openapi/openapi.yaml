  /simulation-runs/{simulationRunId}/commands/submit-decision:
    post:
      operationId: submitDecision
      summary: Submit a Decision command
      description: |
        Typed SubmitDecision command. Requires Idempotency-Key equal to
        commandId, If-Match equal to expectedAggregateVersion, and a current
        projection source version. Returns an acceptance receipt; clients must
        refresh the canonical projection until sourceAggregateVersion reaches
        the receipt aggregateVersion.
      parameters:
        - $ref: "#/components/parameters/SimulationRunId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDecisionRequest"
            examples:
              submit:
                value:
                  commandId: cmd_123
                  commandType: SubmitDecision
                  commandVersion: 1
                  expectedAggregateVersion: 2
                  payload:
                    decisionId: decision_1
                    optionId: option_b
                    rationale: Selected based on stakeholder impact.
      responses:
        "200":
          description: Accepted command receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitDecisionApiResponse"
              examples:
                accepted:
                  value:
                    data:
                      commandId: cmd_123
                      status: accepted
                      aggregateVersion: 3
                      simulationRunId: run_1
                      correlationId: corr_1
                    meta:
                      requestId: req_1
                      correlationId: corr_1
                      apiVersion: v1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access token (never service-role).
  parameters:
    SimulationRunId:
      name: simulationRunId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Must equal body.commandId for SubmitDecision.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Quoted expected aggregate version, e.g. "2".
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
  schemas:
    SubmitDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - commandType
        - commandVersion
        - expectedAggregateVersion
        - payload
      properties:
        commandId:
          type: string
        commandType:
          type: string
          const: SubmitDecision
        commandVersion:
          type: integer
          const: 1
        expectedAggregateVersion:
          type: integer
          minimum: 0
        simulationRunId:
          type: string
        payload:
          type: object
          additionalProperties: false
          required: [decisionId, optionId]
          properties:
            decisionId:
              type: string
              description: DecisionDefinition identifier
            optionId:
              type: string
            rationale:
              type: string
              maxLength: 4000
    SubmitDecisionReceipt:
      type: object
      additionalProperties: false
      required: [commandId, status, aggregateVersion, simulationRunId, correlationId]
      properties:
        commandId: { type: string }
        status: { type: string, const: accepted }
        aggregateVersion: { type: integer }
        simulationRunId: { type: string }
        correlationId: { type: string }
    ClientSimulationProjection:
      type: object
      description: Learner-safe projection (server-only fingerprint fields omitted)
      additionalProperties: true
    ClientMissionControlProjection:
      type: object
      description: |
        Learner-safe Mission Control projection. Empty collections mean no
        learner-visible items; unavailable channel counts are explicit and must
        not be treated as zero. Server-only fingerprint fields omitted.
      additionalProperties: false
      required:
        - projectionType
        - projectionSchemaVersion
        - tenantId
        - simulationRunId
        - learnerId
        - contentPackageVersionId
        - sourceAggregateVersion
        - sourceStateVersion
        - sourceActionSequence
        - generatedAt
        - runSummary
        - projectSummary
        - counts
        - nextRecommendedActions
        - recentRevealedOutcome
      properties:
        projectionId: { type: string }
        projectionType: { type: string, const: mission_control }
        projectionSchemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        simulationRunId: { type: string }
        learnerId: { type: string }
        contentPackageVersionId: { type: string }
        sourceAggregateVersion: { type: integer }
        sourceStateVersion: { type: integer }
        sourceActionSequence: { type: integer }
        generatedAt: { type: string, format: date-time }
        runSummary:
          type: object
          additionalProperties: true
        projectSummary:
          type: object
          additionalProperties: true
        counts:
          type: object
          additionalProperties: true
        nextRecommendedActions:
          type: array
          items:
            type: object
            additionalProperties: true
        recentRevealedOutcome:
          nullable: true
          type: object
          additionalProperties: true
    ProjectionApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ClientSimulationProjection"
        meta:
          type: object
          required:
            - requestId
            - correlationId
            - apiVersion
            - projectionSchemaVersion
            - sourceAggregateVersion
            - freshness
            - generatedAt
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
            projectionSchemaVersion: { type: integer }
            sourceAggregateVersion: { type: integer }
            freshness:
              type: string
              enum: [current, stale, rebuild_failed]
            generatedAt: { type: string, format: date-time }
    ClientDecisionLogProjection:
      type: object
      description: |
        Learner-safe Decision Log projection. Empty entries mean no completed
        learner-visible decisions; this is available empty, not unavailable.
        Server-only fingerprint fields omitted. Entries are newest-first.
      additionalProperties: false
      required:
        - projectionType
        - projectionSchemaVersion
        - tenantId
        - simulationRunId
        - learnerId
        - contentPackageVersionId
        - sourceAggregateVersion
        - sourceStateVersion
        - sourceActionSequence
        - generatedAt
        - entries
        - summary
      properties:
        projectionId: { type: string }
        projectionType: { type: string, const: decision_log }
        projectionSchemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        simulationRunId: { type: string }
        learnerId: { type: string }
        contentPackageVersionId: { type: string }
        sourceAggregateVersion: { type: integer }
        sourceStateVersion: { type: integer }
        sourceActionSequence: { type: integer }
        generatedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - entryId
              - decisionRecordId
              - decisionDefinitionId
              - sequence
              - decidedAt
              - title
              - selectedOption
              - status
              - revealedOutcome
            properties:
              entryId: { type: string }
              decisionRecordId: { type: string }
              decisionDefinitionId: { type: string }
              sequence: { type: integer, minimum: 1 }
              decidedAt: { type: string, format: date-time }
              title: { type: string }
              selectedOption:
                type: object
                additionalProperties: false
                required: [optionId, label]
                properties:
                  optionId: { type: string }
                  label: { type: string, nullable: true }
              status: { type: string, enum: [submitted, resolved] }
              revealedOutcome:
                nullable: true
                type: object
                additionalProperties: false
                required: [summary]
                properties:
                  summary: { type: string }
        summary:
          type: object
          additionalProperties: false
          required: [totalEntries, isEmpty]
          properties:
            totalEntries: { type: integer, minimum: 0 }
            isEmpty: { type: boolean }
    DecisionLogApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ClientDecisionLogProjection"
        meta:
          type: object
          required:
            - requestId
            - correlationId
            - apiVersion
            - projectionSchemaVersion
            - sourceAggregateVersion
            - freshness
            - generatedAt
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
            projectionSchemaVersion: { type: integer, const: 1 }
            sourceAggregateVersion: { type: integer }
            freshness:
              type: string
              enum: [current, stale, rebuild_failed]
            generatedAt: { type: string, format: date-time }
    ClientInboxProjection:
      type: object
      description: |
        Learner-safe Inbox projection. Empty messages mean no delivered
        learner-visible messages; this is available empty, not unavailable.
        Server-only fingerprint fields omitted. Messages are newest-first.
        Read/archive/reply/compose are unsupported.
      additionalProperties: false
      required:
        - projectionType
        - projectionSchemaVersion
        - tenantId
        - simulationRunId
        - learnerId
        - contentPackageVersionId
        - sourceAggregateVersion
        - sourceStateVersion
        - sourceActionSequence
        - generatedAt
        - messages
        - summary
        - capabilities
      properties:
        projectionId: { type: string }
        projectionType: { type: string, const: inbox }
        projectionSchemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        simulationRunId: { type: string }
        learnerId: { type: string }
        contentPackageVersionId: { type: string }
        sourceAggregateVersion: { type: integer }
        sourceStateVersion: { type: integer }
        sourceActionSequence: { type: integer }
        generatedAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - messageId
              - definitionId
              - definitionVersion
              - sequence
              - deliveredAt
              - sender
              - subject
              - preview
              - body
            properties:
              messageId: { type: string }
              definitionId: { type: string }
              definitionVersion: { type: string }
              sequence: { type: integer, minimum: 1 }
              deliveredAt: { type: string, format: date-time, nullable: true }
              sender:
                type: object
                additionalProperties: false
                required: [senderId, displayName, roleLabel]
                properties:
                  senderId: { type: string, nullable: true }
                  displayName: { type: string }
                  roleLabel: { type: string, nullable: true }
              subject: { type: string }
              preview: { type: string }
              body: { type: string }
        summary:
          type: object
          additionalProperties: false
          required: [totalMessages, isEmpty]
          properties:
            totalMessages: { type: integer, minimum: 0 }
            isEmpty: { type: boolean }
        capabilities:
          type: object
          additionalProperties: false
          required: [readState, archive, reply, compose]
          properties:
            readState: { type: string, const: unsupported }
            archive: { type: string, const: unsupported }
            reply: { type: string, const: unsupported }
            compose: { type: string, const: unsupported }
    InboxApiResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ClientInboxProjection"
        meta:
          type: object
          required:
            - requestId
            - correlationId
            - apiVersion
            - projectionSchemaVersion
            - sourceAggregateVersion
            - freshness
            - generatedAt
          properties:
            requestId: { type: string }
            correlationId: { type: string }
            apiVersion: { type: string, const: v1 }
            projectionSchemaVersion: { type: integer, const: 1 }
            sourceAggregateVersion: { type: integer }
            freshness:
              type: string
              enum: [current, stale, rebuild_failed]
            generatedAt: { type: string, format: date-time }
    ClientMeetingsProjection:
      type: object
      description: |
        Learner-safe Meetings projection. Empty meetings mean no authoritative
        Meeting occurrences; this is available empty, not unavailable.
        Server-only fingerprint fields omitted. Meetings are ascending by
        scheduleSequence. Start/complete/cancel/reschedule are unsupported.
      additionalProperties: false
      required:
        - projectionType
        - projectionSchemaVersion
        - tenantId
        - simulationRunId
        - learnerId
        - contentPackageVersionId
        - sourceAggregateVersion
        - sourceStateVersion
        - sourceActionSequence
        - generatedAt
        - meetings
        - summary
        - capabilities
      properties:
        projectionId: { type: string }
        projectionType: { type: string, const: meetings }
        projectionSchemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        simulationRunId: { type: string }
        learnerId: { type: string }
        contentPackageVersionId: { type: string }
        sourceAggregateVersion: { type: integer }
        sourceStateVersion: { type: integer }
        sourceActionSequence: { type: integer }
        generatedAt: { type: string, format: date-time }
        meetings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - meetingOccurrenceId
              - meetingDefinitionId
              - meetingDefinitionVersion
              - scheduleSequence
              - scheduledFor
              - durationMinutes
              - title
              - agenda
              - participants
              - channel
              - location
              - status
              - scheduledAt
              - availableAt
              - startedAt
              - completedAt
              - cancelledAt
            properties:
              meetingOccurrenceId: { type: string }
              meetingDefinitionId: { type: string }
              meetingDefinitionVersion: { type: string }
              scheduleSequence: { type: integer, minimum: 1 }
              scheduledFor: { type: string, format: date-time }
              durationMinutes: { type: integer, minimum: 1, nullable: true }
              title: { type: string }
              agenda: { type: string, nullable: true }
              participants:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [stakeholderId, displayName]
                  properties:
                    stakeholderId: { type: string }
                    displayName: { type: string }
              channel: { type: string, nullable: true }
              location: { type: string, nullable: true }
              status:
                type: string
                enum: [scheduled, available, started, completed, cancelled]
              scheduledAt: { type: string, format: date-time }
              availableAt: { type: string, format: date-time, nullable: true }
